apis:
- aid: wixcom:wix-rest-api
  name: Wix REST API
  description: >-
    The unified Wix REST API exposes every Wix business solution — Stores,
    Bookings, Events, CMS/Data, Contacts, Payments, Marketing, Restaurants,
    Media, Members, and more — as JSON-over-HTTPS endpoints on
    www.wixapis.com, versioned per module (v1/v2/v3) and authenticated with
    API keys, OAuth 2 app tokens, or member/visitor tokens.
  humanURL: https://dev.wix.com/docs/rest
  baseURL: https://www.wixapis.com
  tags:
  - REST
  - eCommerce
  - CMS
  - Bookings
  properties:
  - type: Documentation
    url: https://dev.wix.com/docs/rest
  - type: APIReference
    url: https://dev.wix.com/docs/api-reference
- aid: wixcom:wix-graphql-api
  name: Wix GraphQL API
  description: >-
    The Wix GraphQL API (Developer Preview) exposes Wix APIs as a single
    unified GraphQL schema for queries and mutations, served at
    https://www.wixapis.com/graphql and also callable through the
    @wix/sdk graphql() client method.
  humanURL: https://dev.wix.com/docs/graphql
  baseURL: https://www.wixapis.com/graphql
  tags:
  - GraphQL
  properties:
  - type: Documentation
    url: https://dev.wix.com/docs/graphql
  - type: GraphQL
    url: https://www.wixapis.com/graphql
