      (Developer Preview).
  - id: mcp
    conforms: true
    evidence: Official remote MCP server at https://mcp.wix.com/mcp (mcp/wixcom-mcp.yml).
  - id: llms-txt
    conforms: true
    evidence: https://dev.wix.com/docs/llms.txt (llms/wixcom-llms.txt).
