aid: wixcom
name: Wix.com
description: >-
  Wix.com is a global website-building and business platform (founded 2006,
  260M+ users across 190 countries) whose developer platform spans the Wix
  REST API at www.wixapis.com, a unified GraphQL API, the @wix JavaScript
  SDK family on npm, the Wix CLI for apps and headless projects, Velo site
  code, webhooks for every business solution (Stores, Bookings, Events,
  CMS, Payments, Marketing, Restaurants, and more), an official remote MCP
  server at mcp.wix.com, provider-published agent skills (wix/skills), and
  llms.txt machine-readable docs at dev.wix.com.
