      headless member/visitor auth uses OAuth apps.
  - id: oauth2-client-credentials
    conforms: true
    evidence: Create Access Token with app ID + app secret + app instance ID; Bearer tokens.
  - id: oidc
    conforms: false
    evidence: >-
      No /.well-known/openid-configuration published on www.wix.com,
      dev.wix.com, or www.wixapis.com (probed 2026-07-21, all 404).
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      Errors use Wix's own envelope (message + details.applicationError /
      details.validationError), not application/problem+json
      (errors/wixcom-problem-types.yml).
  - id: rfc8414-oauth-authorization-server-metadata
    conforms: false
    evidence: /.well-known/oauth-authorization-server 404 on all probed hosts.
  - id: rfc9116-security-txt
    conforms: false
    evidence: /.well-known/security.txt 404 on www.wix.com, dev.wix.com, www.wixapis.com.
  - id: cursor-pagination
    conforms: true
