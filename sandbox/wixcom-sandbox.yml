description: >-
  Wix's published testing surface. Wix has no Stripe-style test mode with
  magic test values or test-vs-live key prefixes; instead, testing happens
  against real (non-production) Wix sites. App developers use development
  sites — premium Wix sites reserved for app testing, up to 5 maintained
  simultaneously, switchable via the CLI dev command. Site/SDK developers
  use test sites and a local development environment with hot reloading
  (CLI `dev`), plus shareable preview versions before release. Nothing in
  this file is invented; only the mechanisms Wix documents are recorded.
modes:
